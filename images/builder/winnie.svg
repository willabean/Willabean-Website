<?xml version="1.0" encoding="UTF-8"?>
<!--
  WINNIE — two-layer collar template for the live collar builder.

  EDITING NOTES
  -------------
  Open this in Inkscape (free) or Illustrator. You can drag, resize, recolour,
  reshape any element. Just keep the IDs the same — the live builder finds
  elements by id and tints them at runtime:

    #layer-1, #layer-2 (etc.)         tinted with the customer's chosen colour
                                      for that layer. Add #layer-3 if you want
                                      a 3-layer variant.
    #layer-1-sheen, #layer-2-sheen    optional highlight strip per layer.
                                      Delete if not wanted.
    .rivet                            every circle with class="rivet" is
                                      tinted with the chosen hardware finish.
    .hw-fill, .hw-stroke,             three classes the builder uses to tint
    .hw-outline                       hardware: solid fill, the thicker
                                      stroke, and the dark outline.
    #hardware-left                    D-ring group on the lead-attachment end.
    #hardware-right-buckle            buckle group (default visible).
    #hardware-right-clasp             clasp group (default hidden — builder
                                      toggles between them).

  The viewBox is 0 0 760 280. Edit anything inside that frame and save.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 760 280"
     width="760" height="280"
     role="img"
     aria-label="The Winnie — two-layer collar template">

  <title>The Winnie — two-layer collar template</title>
  <desc>Editable template for the live collar builder. Layers, rivets and hardware are recoloured at runtime; preserve the element IDs and class names.</desc>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ede0"/>
      <stop offset="1" stop-color="#ece2cf"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background frame (won't be tinted) -->
  <rect id="bg" width="760" height="280" fill="url(#bg-gradient)" rx="20" ry="20"/>

  <g id="collar" filter="url(#drop)" inkscape:label="Collar">

    <!-- ============ LAYER 1 (BASE) ============ -->
    <rect id="layer-1" inkscape:label="Layer 1 (base)"
          x="90" y="105" width="580" height="70"
          rx="35" ry="35"
          fill="#a67b40" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
    <rect id="layer-1-sheen" inkscape:label="Layer 1 sheen"
          x="94" y="109" width="572" height="13" rx="2" ry="2"
          fill="rgba(255,255,255,0.18)" pointer-events="none"/>

    <!-- ============ LAYER 2 (TOP) ============ -->
    <rect id="layer-2" inkscape:label="Layer 2 (top contrast)"
          x="108" y="115" width="544" height="50"
          rx="25" ry="25"
          fill="#3e5236" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
    <rect id="layer-2-sheen" inkscape:label="Layer 2 sheen"
          x="112" y="118" width="536" height="9" rx="2" ry="2"
          fill="rgba(255,255,255,0.18)" pointer-events="none"/>

    <!-- ============ RIVETS — TOP ROW ============ -->
    <g id="rivets-top" inkscape:label="Rivets (top row)">
      <circle class="rivet" cx="140" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="200" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="260" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="320" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="380" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="440" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="500" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="560" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="620" cy="111" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
    </g>

    <!-- ============ RIVETS — BOTTOM ROW ============ -->
    <g id="rivets-bottom" inkscape:label="Rivets (bottom row)">
      <circle class="rivet" cx="140" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="200" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="260" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="320" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="380" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="440" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="500" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="560" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
      <circle class="rivet" cx="620" cy="169" r="2.4" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
    </g>

    <!-- ============ LEFT HARDWARE — D-RING ============ -->
    <g id="hardware-left" inkscape:label="Left hardware (D-ring)">
      <circle class="hw-stroke" cx="76" cy="140" r="22" fill="none" stroke="#c9c9c5" stroke-width="6"/>
      <circle class="hw-outline" cx="76" cy="140" r="22" fill="none" stroke="#888881" stroke-width="1"/>
      <rect class="hw-fill" x="84" y="135" width="14" height="10" fill="#c9c9c5" stroke="#888881" stroke-width="0.8"/>
    </g>

    <!-- ============ RIGHT HARDWARE — BUCKLE (default) ============ -->
    <g id="hardware-right-buckle" inkscape:label="Right hardware (buckle)">
      <rect class="hw-fill" x="666" y="112" width="4" height="56" fill="#c9c9c5" stroke="#888881" stroke-width="0.8"/>
      <rect class="hw-stroke" x="672" y="112" width="42" height="56" rx="4" ry="4"
            fill="none" stroke="#c9c9c5" stroke-width="6"/>
      <rect class="hw-outline" x="672" y="112" width="42" height="56" rx="4" ry="4"
            fill="none" stroke="#888881" stroke-width="1"/>
      <rect class="hw-fill" x="691" y="110" width="3" height="60" fill="#c9c9c5" stroke="#888881" stroke-width="0.6"/>
    </g>

    <!-- ============ RIGHT HARDWARE — CLASP (hidden by default) ============ -->
    <g id="hardware-right-clasp" inkscape:label="Right hardware (clasp)" style="display:none">
      <rect class="hw-fill" x="666" y="118" width="48" height="44" rx="6" ry="6" fill="#c9c9c5" stroke="#888881" stroke-width="1"/>
      <rect x="674" y="124" width="32" height="32" rx="4" ry="4" fill="rgba(0,0,0,0.18)"/>
      <rect class="hw-outline" x="680" y="132" width="20" height="16" rx="2" ry="2" fill="#888881"/>
    </g>

  </g>
</svg>
